[package]
name = "vlc-addon-worker"
version = "1.0.0"
edition = "2021"
rust-version = "1.97"
license = "GPL-2.0-or-later"
publish = false

# This independently packaged executable must not inherit the VLC module ABI.
[workspace]

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
wasmtime = { version = "=50.0.0", default-features = false, features = ["cranelift", "runtime", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
wat = "1.0"

[profile.release]
strip = true
opt-level = "s"
lto = "thin"
