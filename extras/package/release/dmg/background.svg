<!-- Hakone disk image window background. Re-render with render-background.py.
     Layout (window content points): Hakone.app icon centred at (170, 230),
     Applications at (470, 230); see settings.py. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#eeeef0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#paper)"/>
  <text x="320" y="84" text-anchor="middle" font-family="Inter" font-weight="600"
        font-size="28" letter-spacing="-0.4" fill="#1d1d1f">Install Hakone</text>
  <text x="320" y="114" text-anchor="middle" font-family="Inter" font-weight="400"
        font-size="15" fill="#6e6e73">Drag to Applications</text>
  <g fill="none" stroke="#a1a1a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 230 H376"/>
    <path d="M366 220 L378 230 L366 240"/>
  </g>
</svg>
