[package]
name = "vlc-addon-french-tv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vlc-artwork-providers = { path = "../../sdk/artwork-providers" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
